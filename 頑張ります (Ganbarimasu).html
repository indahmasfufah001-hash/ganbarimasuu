<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>頑張ります (Ganbarimasu)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3fbf6;--card:#fff;--tx:#173a2c;--mu:#5b7a6c;--pr:#12a36b;--pr2:#0d7d52;--ac:#ffb703;--bd:#d6eadf;--rd:#e5484d;--box-sizing:border-box;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1f18;--card:#172a21;--tx:#e6f5ec;--mu:#92b3a2;--bd:#27443a;--pr:#2fd093;--pr2:#1fa774;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1f18;--card:#172a21;--tx:#e6f5ec;--mu:#92b3a2;--bd:#27443a;--pr:#2fd093;--pr2:#1fa774;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Nunito","Segoe UI",system-ui,sans-serif;line-height:1.5}
.w{max-width:760px;margin:0 auto;padding:16px}
h1,h2,h3{margin:.2em 0}.mu{color:var(--mu);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 4px 14px rgba(18,163,107,.08)}
.hero{text-align:center;padding:26px 10px}.hero .big{font-size:3.4rem;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px) rotate(4deg)}}
input,select,button{font:inherit;border-radius:14px}
input,select{width:100%;padding:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);margin:6px 0}
input:focus{outline:none;border-color:var(--pr)}
button{border:0;background:var(--pr);color:#fff;padding:12px 18px;font-weight:800;cursor:pointer;transition:transform .15s}
button:hover{transform:scale(1.04)}button.s{background:var(--bg);color:var(--tx);border:2px solid var(--bd)}
button.on{background:var(--pr2);color:#fff;border-color:var(--pr2)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}nav button{flex:0 0 auto;font-size:.9rem;padding:10px 14px}
.moods{display:flex;justify-content:space-between;gap:6px}.moods button{font-size:1.9rem;padding:8px;background:var(--bg);flex:1;border:2px solid var(--bd)}
.moods button.on{border-color:var(--pr);transform:scale(1.12)}
.bar{height:14px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--ac));transition:width .5s}
.b{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.8rem;font-weight:800;color:#fff}
.Rendah{background:#12a36b}.Sedang{background:#e69500}.Tinggi{background:#e5484d}
.q{padding:10px 0;border-bottom:1px dashed var(--bd)}
.mis{display:flex;align-items:center;gap:10px;padding:10px;border:2px solid var(--bd);border-radius:14px;margin:7px 0;cursor:pointer}
.mis.d{background:var(--bg);opacity:.7;text-decoration:line-through;border-color:var(--pr)}
#br{width:150px;height:150px;border-radius:50%;margin:20px auto;background:radial-gradient(circle,var(--pr),var(--pr2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;transition:transform 4s ease-in-out;text-align:center}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:800;z-index:9}
.hid{display:none}
</style></head><body><div class="w" id="app"></div>
<script>
const $=s=>document.querySelector(s),A=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NIP_TERDAFTAR=[]; /* isi dengan NIP guru resmi, contoh: ['198001012005012001'] */
const today=()=>new Date().toISOString().slice(0,10);
const IBERT_URL=''; /* isi dengan URL API IndoBERT (lihat indobert_api.py), contoh: 'https://domain-anda/predict' */
const R3=['Rendah','Sedang','Tinggi'];
const LEX={T:['bunuh diri','mau mati','menyakiti diri','putus asa','menyerah','tidak sanggup','nggak sanggup','gak sanggup','tidak kuat','nggak kuat','muak','hancur','tidak berguna','benci sekolah','tertekan'],S:['capek','lelah','malas','bosan','pusing','menumpuk','numpuk','sulit fokus','susah fokus','bingung','kesal','cemas','takut','sedih','menangis','nangis','stres','stress','tidak semangat','nggak semangat','gak semangat']};
async function klasifikasi(t){const x=t.toLowerCase(),urg=LEX.T.slice(0,3).some(w=>x.includes(w));
if(IBERT_URL){try{const c=new AbortController(),id=setTimeout(()=>c.abort(),8000);const r=await fetch(IBERT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t}),signal:c.signal});clearTimeout(id);const j=await r.json();if(R3.includes(j.label))return{label:j.label,conf:+j.confidence||0,source:'IndoBERT',urgent:urg}}catch(e){}}
const h=k=>LEX[k].filter(w=>x.includes(w)).length,a=h('T'),b=h('S');
return{label:a>0||b>=4?'Tinggi':b>=2?'Sedang':'Rendah',conf:Math.min(.9,.55+.1*(a+b)),source:'mode prototipe: kata kunci, IndoBERT belum terhubung',urgent:urg}}
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S=ls.get('sess',null),tab='mood',db=null;
(async()=>{try{if(window.claude){db=await claude.use('db');if(S&&S.role==='guru')render()}}catch(e){db=null}})();
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
const key=()=>'u_'+(S.nama+S.kelas).toLowerCase().replace(/[^a-z0-9]/g,'');
const P=()=>ls.get('p_'+key(),{xp:0,streak:0,last:'',done:{},tasks:[],mood:null,score:null,level:null});
const SP=p=>ls.set('p_'+key(),p);

function login(){A.innerHTML=`<div class="hero"><div class="big">🌱</div><div style="font-size:2.4rem;font-weight:800;color:var(--pr)">頑張ります!</div><div class="mu" style="letter-spacing:.2em;margin-bottom:6px">GANBARIMASU</div><h2 style="margin-top:10px">Kamu hebat! Capek itu wajar, menyerah jangan ya 💚</h2>
<p class="mu">Pelan-pelan juga tidak apa-apa, yang penting terus melangkah.</p></div>
<div class="card"><div class="row"><button id="ts" class="on">🎒 Siswa</button><button id="tg" class="s">👩‍🏫 Guru</button></div>
<div id="fs"><label>Nama lengkap</label><input id="nm" placeholder="contoh: Nama Lengkap" maxlength="40">
<label>Kelas</label><input id="kl" placeholder="contoh: 8C" maxlength="6">
<button id="go" style="width:100%;margin-top:10px">Masuk 🚀</button></div>
<div id="fg" class="hid"><label>NIP Guru</label><input id="nip" inputmode="numeric" placeholder="18 digit NIP" maxlength="18">
<button id="gg" style="width:100%;margin-top:10px">Masuk Dashboard 📊</button></div></div>
`;
$('#ts').onclick=()=>{$('#fs').classList.remove('hid');$('#fg').classList.add('hid');$('#ts').className='on';$('#tg').className='s'};
$('#tg').onclick=()=>{$('#fg').classList.remove('hid');$('#fs').classList.add('hid');$('#tg').className='on';$('#ts').className='s'};
$('#go').onclick=()=>{const n=$('#nm').value.trim(),k=$('#kl').value.trim().toUpperCase();if(n.length<3||!k)return toast('Isi nama & kelas dulu ya 😊');S={role:'siswa',nama:n,kelas:k};ls.set('sess',S);tab='mood';render()};
$('#gg').onclick=()=>{const n=$('#nip').value.trim();if(!/^\d{18}$/.test(n))return toast('NIP harus 18 digit angka');if(NIP_TERDAFTAR.length&&!NIP_TERDAFTAR.includes(n))return toast('NIP belum terdaftar. Hubungi admin sekolah');S={role:'guru',nip:n};ls.set('sess',S);render()}}

function render(){if(!S)return login();S.role==='guru'?guru():siswa()}
function out(){try{localStorage.removeItem('sess')}catch(e){}S=null;login()}
function head(t){return `<div class="top"><div><h2>${t}</h2><span class="mu">MTsN 5 Garut</span></div><button class="s" onclick="out()">Keluar</button></div>`}

function siswa(){const p=P(),lv=Math.floor(p.xp/50)+1;
A.innerHTML=head('Halo, '+esc(S.nama.split(' ')[0])+' 👋')+`<div class="card"><div class="top"><b>Level ${lv} ${['🌱','🌿','🌳','🌟','🏆'][Math.min(lv-1,4)]}</b><span>🔥 ${p.streak} hari • ${p.xp} XP</span></div><div class="bar"><i style="width:${(p.xp%50)*2}%"></i></div></div>
<nav>${[['mood','😊 Cek Diri'],['misi','🎯 Misi'],['napas','🌬️ Napas'],['game','🎮 Game'],['jadwal','📅 Jadwal'],['tips','💡 Tips'],['curhat','🎙️ Curhat']].map(([k,l])=>`<button class="${tab===k?'on':'s'}" onclick="tab='${k}';siswa()">${l}</button>`).join('')}</nav><div id="c"></div>`;
({mood,misi,napas,game,jadwal,tips,curhat})[tab]()}
function addXP(n,m){const p=P();p.xp+=n;const t=today();if(p.last!==t){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);p.streak=p.last===y?p.streak+1:1;p.last=t}SP(p);toast(m||`+${n} XP ✨`)}

const QS=['Aku merasa capek terus meski sudah istirahat','Aku malas dan tidak semangat berangkat atau belajar','Tugas dan kegiatan terasa menumpuk, bingung mulai dari mana','Aku sulit fokus saat belajar','Aku mudah kesal atau ingin menangis tanpa sebab jelas','Aku merasa usahaku tidak ada hasilnya'];
const MD=['😭','😟','😐','🙂','🤩'];
function mood(){const p=P();let m=p.mood,ans=Array(QS.length).fill(-1);
$('#c').innerHTML=`<div class="card"><h3>Apa kabar hatimu hari ini?</h3><div class="moods">${MD.map((e,i)=>`<button data-i="${i}" class="${m===i?'on':''}">${e}</button>`).join('')}</div></div>
<div class="card"><h3>Ceritakan Perasaanmu ✍️</h3><p class="mu">Tulis bebas dengan bahasamu sendiri (2–3 kalimat). Teks akan dianalisis model deep learning IndoBERT untuk mendeteksi tanda awal burnout akademik.</p><textarea id="tx" maxlength="400" rows="4" placeholder="Contoh: Aku capek banget akhir-akhir ini, tugas numpuk dan aku malas berangkat sekolah..." style="width:100%;padding:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:14px;font:inherit;resize:vertical"></textarea></div>
<div class="card"><h3>Tes Burnout Singkat</h3><p class="mu">Jawab jujur, tidak ada nilai benar atau salah.</p>${QS.map((q,i)=>`<div class="q">${i+1}. ${q}<div class="row" style="margin-top:6px">${['Tidak pernah','Kadang','Sering','Selalu'].map((l,v)=>`<button class="s" style="padding:7px;font-size:.78rem" data-q="${i}" data-v="${v}">${l}</button>`).join('')}</div></div>`).join('')}
<button id="sub" style="width:100%;margin-top:12px">Lihat Hasil 🔍</button><div id="res"></div></div>`;
document.querySelectorAll('.moods button').forEach(b=>b.onclick=()=>{m=+b.dataset.i;document.querySelectorAll('.moods button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const i=+b.dataset.q;ans[i]=+b.dataset.v;document.querySelectorAll(`[data-q="${i}"]`).forEach(x=>x.className='s');b.className='on'});
$('#sub').onclick=async()=>{if(m===null||ans.includes(-1))return toast('Lengkapi mood & semua pertanyaan ya');const tx=($('#tx').value||'').trim();if(tx.length<10)return toast('Tulis dulu perasaanmu (min. 10 huruf) ✍️');toast('Menganalisis teks…');const ai=await klasifikasi(tx);
const sc=ans.reduce((a,b)=>a+b,0),lvA=sc<=5?'Rendah':sc<=11?'Sedang':'Tinggi',lvl=R3[Math.max(R3.indexOf(lvA),R3.indexOf(ai.label))];
const msg={Rendah:'Kamu masih baik-baik saja. Pertahankan rutinitas sehat! 🌈',Sedang:'Ada tanda lelah. Coba kurangi beban, istirahat cukup, dan ceritakan ke teman atau orang tua. 💚',Tinggi:'Kamu sedang sangat lelah, dan itu bukan salahmu. Yuk ngobrol dengan Guru BK supaya dibantu. 🤗'}[lvl];
const q=P();q.mood=m;q.score=sc;q.level=lvl;SP(q);addXP(15,'Cek diri selesai +15 XP 🎉');
$('#res').innerHTML=`<div class="card" style="text-align:center"><div style="font-size:2.6rem">${MD[m]}</div><h3>Skor ${sc}/18 <span class="b ${lvl}">${lvl}</span></h3><p>${msg}</p><p class="mu">🤖 Analisis teks (${esc(ai.source)}): <span class="b ${ai.label}">${ai.label}</span> • keyakinan ${Math.round(ai.conf*100)}%<br>Angket: <span class="b ${lvA}">${lvA}</span></p>${ai.urgent?'<p><b>Kalau kamu merasa ingin menyakiti dirimu, segera bicara dengan Guru BK atau orang dewasa yang kamu percaya sekarang juga.</b></p>':''}</div>`;
if(db){try{await db.doc('checkins/'+key()).set({nama:S.nama,kelas:S.kelas,mood:m,score:sc,level:lvl,teks:tx,ai:ai.label,conf:ai.conf,src:ai.source,urgent:!!ai.urgent,ts:Date.now()});toast('Terkirim ke Guru BK ✅')}catch(e){}}}}

const MIS=[['💧','Minum air 6 gelas',5],['🛏️','Tidur sebelum jam 10 malam',10],['📵','1 jam tanpa HP sebelum tidur',10],['🚶','Gerak/olahraga 10 menit',8],['🙏','Salat tepat waktu & berdoa tenang',8],['💬','Cerita ke satu orang yang kupercaya',10],['🎨','Lakukan hobi 15 menit',8],['📝','Tulis 3 hal yang aku syukuri',7]];
function misi(){const p=P(),d=p.done[today()]||[];
$('#c').innerHTML=`<div class="card"><h3>Misi Hari Ini 🎯</h3><p class="mu">Ketuk misi yang sudah kamu lakukan. Selesaikan semua untuk bonus!</p>${MIS.map((m,i)=>`<div class="mis ${d.includes(i)?'d':''}" data-i="${i}"><span style="font-size:1.6rem">${m[0]}</span><span style="flex:1">${m[1]}</span><b>+${m[2]}</b></div>`).join('')}</div>`;
document.querySelectorAll('.mis').forEach(e=>e.onclick=()=>{const i=+e.dataset.i,q=P(),t=today();q.done[t]=q.done[t]||[];if(q.done[t].includes(i))return;q.done[t].push(i);SP(q);addXP(MIS[i][2]);if(q.done[t].length===MIS.length)addXP(20,'🏆 Semua misi tuntas! Bonus +20');misi();siswa.keep=1;const x=P();document.querySelector('.card .bar i').style.width=(x.xp%50)*2+'%'})}

let timer;
function napas(){clearInterval(timer);$('#c').innerHTML=`<div class="card" style="text-align:center"><h3>Napas Tenang 🌬️</h3><p class="mu">Tarik napas 4 detik, tahan 2 detik, buang 6 detik. Ulangi 5 kali.</p><div id="br">Siap?</div><button id="st">Mulai</button><p id="cnt" class="mu"></p></div>`;
$('#st').onclick=()=>{let n=0;const b=$('#br'),run=()=>{if(n>=5){clearInterval(timer);b.textContent='Selesai 💚';b.style.transform='scale(1)';$('#cnt').textContent='Hebat! Semoga lebih tenang.';addXP(10);return}n++;$('#cnt').textContent='Putaran '+n+' / 5';b.textContent='Tarik napas…';b.style.transition='transform 4s ease-in-out';b.style.transform='scale(1.5)';setTimeout(()=>{b.textContent='Tahan…'},4000);setTimeout(()=>{b.textContent='Buang pelan…';b.style.transition='transform 6s ease-in-out';b.style.transform='scale(1)'},6000)};run();timer=setInterval(run,12000)}}

function jadwal(){const p=P();
$('#c').innerHTML=`<div class="card"><h3>Jadwal Pintarku 📅</h3><p class="mu">Tips: pilih maksimal 3 prioritas per hari. Sisakan waktu istirahat!</p><input id="tt" placeholder="Kegiatan / tugas…" maxlength="60"><div class="row"><select id="tk"><option>🏫 Sekolah</option><option>🏠 Luar sekolah</option><option>😴 Istirahat</option></select><select id="th">${['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'].map(h=>`<option>${h}</option>`).join('')}</select></div><button id="ad" style="width:100%;margin-top:8px">Tambah ➕</button></div>
<div class="card" id="ls">${p.tasks.length?p.tasks.map((t,i)=>`<div class="mis ${t.d?'d':''}" data-i="${i}"><span style="flex:1"><b>${esc(t.t)}</b><br><span class="mu">${esc(t.h)} • ${esc(t.k)}</span></span><button class="s" data-x="${i}">🗑️</button></div>`).join(''):'<p class="mu">Belum ada kegiatan. Yuk tambahkan!</p>'}</div>`;
$('#ad').onclick=()=>{const t=$('#tt').value.trim();if(!t)return;const q=P();q.tasks.push({t,k:$('#tk').value,h:$('#th').value,d:0});SP(q);jadwal()};
document.querySelectorAll('.mis').forEach(e=>e.onclick=ev=>{const q=P(),i=+e.dataset.i;if(ev.target.dataset.x!==undefined){q.tasks.splice(+ev.target.dataset.x,1);SP(q);return jadwal()}q.tasks[i].d=q.tasks[i].d?0:1;SP(q);if(q.tasks[i].d)addXP(3,'Mantap! +3 XP');jadwal()})}

const TIPS=[['🧩','Pecah tugas besar','Bagi jadi langkah kecil 15–25 menit, lalu istirahat 5 menit (teknik Pomodoro).'],['🛌','Tidur cukup','Remaja butuh 8–10 jam tidur. Otak “mengisi ulang” saat tidur.'],['🙅','Boleh bilang tidak','Kamu tidak harus ikut semua kegiatan. Pilih yang paling penting.'],['🎉','Rayakan kemajuan kecil','Selesai satu tugas? Beri hadiah kecil untuk dirimu.'],['🗣️','Ceritakan perasaanmu','Bicara dengan teman, orang tua, wali kelas, atau Guru BK.'],['🤲','Ingat tujuanmu','Belajar adalah ibadah. Niatkan karena Allah, dan jangan bandingkan dirimu dengan orang lain.']];
function curhat(){$('#c').innerHTML=`<div class="card"><h3>Sesi Curhat 🎙️</h3><p class="mu">Ceritakan apa yang kamu rasakan. Ketik, atau tekan tombol Bicara kalau malas menulis. Ceritamu dianalisis model deep learning IndoBERT untuk mendeteksi tanda awal burnout akademik.</p><textarea id="ct" maxlength="600" rows="6" placeholder="Ceritakan saja, tidak ada yang salah di sini..." style="width:100%;padding:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:14px;font:inherit;resize:vertical"></textarea><div class="row" style="margin-top:10px"><button id="mc" class="s">🎙️ Bicara</button><button id="cs">Kirim Curhat 💌</button></div><p id="mst" class="mu"></p><div id="cr"></div></div>`;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,on=false;
$('#mc').onclick=()=>{if(!SR)return toast('Browser ini belum mendukung suara. Coba Chrome, atau ketik saja ya 🙏');if(on){rec.stop();return}
rec=new SR();rec.lang='id-ID';rec.continuous=true;rec.interimResults=false;
rec.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t+=e.results[i][0].transcript+' ';const a=$('#ct');if(a)a.value=(a.value+' '+t).trim()};
rec.onstart=()=>{on=true;$('#mc').textContent='⏹️ Berhenti';$('#mst').textContent='🔴 Mendengarkan… silakan bicara'};
rec.onend=()=>{on=false;const b=$('#mc');if(b){b.textContent='🎙️ Bicara';$('#mst').textContent=''}};
rec.onerror=e=>toast(e.error==='not-allowed'||e.error==='service-not-allowed'?'Mikrofon diblokir. Izinkan mikrofon di browser, atau ketik saja ya 🙏':'Suara gagal ('+e.error+'). Coba lagi atau ketik saja');
try{rec.start()}catch(e){}};
$('#cs').onclick=async()=>{if(rec&&on)rec.stop();const tx=$('#ct').value.trim();if(tx.length<10)return toast('Ceritakan dulu beberapa kalimat ya ✍️');toast('Menganalisis…');const ai=await klasifikasi(tx);
const msg={Rendah:'Terima kasih sudah bercerita. Kamu terlihat baik-baik saja, tetap jaga rutinitas sehat ya 🌈',Sedang:'Terima kasih sudah jujur. Ada tanda lelah, coba istirahat dan cerita ke orang yang kamu percaya 💚',Tinggi:'Terima kasih sudah berani bercerita. Kamu sedang sangat lelah dan itu bukan salahmu. Yuk ngobrol dengan Guru BK supaya dibantu 🤗'}[ai.label];
const q=P();addXP(10,'Terima kasih sudah bercerita +10 XP 💚');
$('#cr').innerHTML=`<div class="card" style="text-align:center"><p>${msg}</p><p class="mu">🤖 Analisis teks (${esc(ai.source)}): <span class="b ${ai.label}">${ai.label}</span> • keyakinan ${Math.round(ai.conf*100)}%</p>${ai.urgent?'<p><b>Kalau kamu merasa ingin menyakiti dirimu, segera bicara dengan Guru BK atau orang dewasa yang kamu percaya sekarang juga.</b></p>':''}</div>`;
if(db){try{const lvl=R3[Math.max(R3.indexOf(q.level||'Rendah'),R3.indexOf(ai.label))];await db.doc('checkins/'+key()).set({nama:S.nama,kelas:S.kelas,mood:q.mood===undefined?null:q.mood,score:q.score||0,level:lvl,teks:tx,ai:ai.label,conf:ai.conf,src:ai.source,urgent:!!ai.urgent,ts:Date.now()});toast('Terkirim ke Guru BK ✅')}catch(e){}}}}
function tips(){$('#c').innerHTML=TIPS.map(t=>`<div class="card"><h3>${t[0]} ${t[1]}</h3><p>${t[2]}</p></div>`).join('')+`<div class="card" style="text-align:center"><h3>Butuh teman cerita?</h3><p>Temui <b>Guru BK</b> di ruang BK. Kamu tidak sendirian 💚</p></div>`}

let gt;
function game(){clearInterval(gt);$('#c').innerHTML=`<div class="card"><h3>🎮 Arcade Semangat</h3><p class="mu">Main sebentar, dapat XP, pikiran segar lagi!</p><div class="row"><button onclick="gStress()">👊 Tangkap Semangat</button><button class="s" onclick="gMem()">🃏 Memory Positif</button></div></div><div id="g"></div>`}
function gStress(){clearInterval(gt);let sc=0,t=25;
$('#g').innerHTML=`<div class="card" style="text-align:center"><h3>Tangkap Semangat!</h3><p class="mu">Ketuk ☀️💪📚⭐ (+1). Hindari 😫🌧️ (−2).</p><b id="gi">Skor 0 • sisa 25</b><div id="gr" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px"></div></div>`;
const cells=[...Array(9)].map(()=>{const d=document.createElement('button');d.className='s';d.style.cssText='font-size:2.2rem;height:84px';$('#gr').appendChild(d);return d});
const good=['☀️','💪','📚','⭐'],bad=['😫','🌧️'],R=a=>a[Math.floor(Math.random()*a.length)];
cells.forEach(c=>c.onclick=()=>{if(!c.dataset.k)return;sc+=c.dataset.k==='g'?1:-2;c.textContent='';c.dataset.k='';$('#gi').textContent='Skor '+sc+' • sisa '+t});
gt=setInterval(()=>{t--;cells.forEach(c=>{c.textContent='';c.dataset.k=''});
if(t<=0){clearInterval(gt);$('#gi').textContent='Selesai! Skor '+sc;const xp=Math.max(0,Math.min(15,sc));if(xp)addXP(xp);return}
[...cells].sort(()=>Math.random()-.5).slice(0,3).forEach(c=>{const g=Math.random()<.7;c.textContent=R(g?good:bad);c.dataset.k=g?'g':'b'});
$('#gi').textContent='Skor '+sc+' • sisa '+t},800)}
function gMem(){clearInterval(gt);const e=['🌞','📚','💪','🌱','🕌','🎨'],d=[...e,...e].sort(()=>Math.random()-.5);let a=null,lock=0,mv=0,m=0;
$('#g').innerHTML=`<div class="card" style="text-align:center"><h3>Memory Positif</h3><b id="mi">Langkah 0</b><div id="mg" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px"></div></div>`;
d.forEach(v=>{const b=document.createElement('button');b.className='s';b.style.cssText='font-size:2rem;height:72px';b.textContent='❓';$('#mg').appendChild(b);
b.onclick=()=>{if(lock||b.disabled||b===a)return;b.textContent=v;if(!a){a=b;return}mv++;$('#mi').textContent='Langkah '+mv;
if(a.textContent===v){a.disabled=b.disabled=true;a=null;if(++m===6)addXP(mv<=10?15:10,'Menang! XP bertambah 🎉')}
else{lock=1;const x=a;a=null;setTimeout(()=>{x.textContent=b.textContent='❓';lock=0},700)}}})}
let unsub;
function guru(){A.innerHTML=head('Dashboard Guru BK 👩‍🏫')+`<div class="card"><p class="mu">NIP ${esc(S.nip)} • Guru BK</p><div class="row" id="st"></div></div><div class="card tbl"><h3>Hasil Cek Diri Siswa</h3><div id="tb"><p class="mu">Memuat…</p></div></div>`;
const show=rows=>{const c=l=>rows.filter(r=>r.level===l).length;
$('#st').innerHTML=[['Sudah isi',rows.length],['Rendah',c('Rendah')],['Sedang',c('Sedang')],['Tinggi',c('Tinggi')]].map(x=>`<div style="text-align:center"><b style="font-size:1.5rem">${x[1]}</b><br><span class="mu">${x[0]}</span></div>`).join('');
const o={Tinggi:0,Sedang:1,Rendah:2};rows.sort((a,b)=>o[a.level]-o[b.level]);
$('#tb').innerHTML=rows.length?`<table><tr><th>Nama</th><th>Kelas</th><th>Mood</th><th>Skor</th><th>Level</th><th>Analisis teks (IndoBERT)</th></tr>${rows.map(r=>`<tr><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td><td>${MD[r.mood]||''}</td><td>${+r.score}</td><td><span class="b ${esc(r.level)}">${esc(r.level)}</span></td><td>${r.ai?`<span class="b ${esc(r.ai)}">${esc(r.ai)}</span> ${Math.round((+r.conf||0)*100)}%<br><span class="mu">${r.urgent?'⚠️ ':''}${esc(r.teks||'')}</span>`:'-'}</td></tr>`).join('')}</table>`:'<p class="mu">Belum ada siswa yang mengisi cek diri.</p>'};
if(unsub)try{unsub()}catch(e){}
if(db){try{unsub=db.collection('checkins').onSnapshot(s=>{const r=[];s.forEach(d=>r.push(d.data()));show(r)})}catch(e){show([])}}else show([]);
setTimeout(()=>{if(S&&S.role==='guru'&&db&&!unsub)guru()},3000)}
render();
</script></body></html>
